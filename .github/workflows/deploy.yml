# GitHub Actions - 메인 배포 워크플로우
name: Deploy

## 트리거: 지정 브랜치에 push될 때
on:
  push:
    branches:
      - dev
      - prod
      - dockerize-for-dynamic-scraping

permissions:
  contents: read

## 동시 실행 제어: 같은 브랜치의 중복 실행을 한 그룹으로 묶음
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # 진행 중 작업 취소하지 않음

## 배포 jobs 정의
jobs:
  # 1. 환경 설정 및 Python 레이어 빌드
  setup-environment:
    name: Setup Environment
    uses: ./.github/workflows/setup-environment.yml
    with:
      stage: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
    secrets:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      DB_NAME: ${{ secrets.DB_NAME }}
      PROD_MONGODB_URI: ${{ secrets.PROD_MONGODB_URI }}
      PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

  # 2. Docker 이미지 빌드
  build-images:
    name: Build Docker Images
    needs: setup-environment
    uses: ./.github/workflows/build.yml
    with:
      stage: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
      aws_region: ap-northeast-2
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # 3. ECR에 Docker 이미지 배포
  deploy-to-ecr:
    name: Deploy to ECR
    needs: build-images
    uses: ./.github/workflows/deploy-ecr.yml
    with:
      stage: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
      aws_region: ap-northeast-2
      build-info-file: ${{ needs.build-images.outputs.build-info-file }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # 4. Serverless Framework로 AWS Lambda 배포
  deploy-serverless:
    name: Deploy Serverless
    needs: [setup-environment, deploy-to-ecr]
    uses: ./.github/workflows/deploy-serverless.yml
    with:
      stage: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
      aws_region: ap-northeast-2
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
