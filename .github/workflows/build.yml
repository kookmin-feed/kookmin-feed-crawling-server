# Docker 이미지 빌드 전용 워크플로우
name: Build Docker Images

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
        description: 'Deployment stage (dev/prod)'
      aws_region:
        required: false
        type: string
        default: 'ap-northeast-2'
        description: 'AWS region'
    outputs:
      build-info-file:
        description: 'Path to build info file'
        value: ${{ jobs.build.outputs.build-info-file }}
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    outputs:
      build-info-file: ${{ steps.build-images.outputs.build-info-file }}
    env:
      STAGE: ${{ inputs.stage }}
      AWS_REGION: ${{ inputs.aws_region }}
      TZ: Asia/Seoul
    steps:
      # 저장소 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # AWS 프로필 생성
      - name: Create AWS named profile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile kookmin-feed
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile kookmin-feed
          aws configure set region "$AWS_REGION" --profile kookmin-feed

      # Docker 이미지 빌드
      - name: Build Docker images
        id: build-images
        run: |
          echo "🚀 Multi-Target Docker 이미지 빌드 시작 - Stage: ${{ env.STAGE }}"
          
          # Dockerfile에서 모든 stage 추출
          echo "🔍 Dockerfile에서 stage 분석 중..."
          ALL_STAGES=($(grep -E "^FROM.*AS" "Dockerfile" | sed 's/.*AS //'))
          
          if [ ${#ALL_STAGES[@]} -eq 0 ]; then
              echo "❌ Dockerfile에서 stage를 찾을 수 없습니다."
              exit 1
          fi
          
          # base stage는 중간 단계이므로 ECR 푸시에서 제외
          STAGES=()
          for stage in "${ALL_STAGES[@]}"; do
              if [ "$stage" != "base" ]; then
                  STAGES+=("$stage")
              fi
          done
          
          echo "📋 발견된 모든 stage들:"
          for stage in "${ALL_STAGES[@]}"; do
              if [ "$stage" = "base" ]; then
                  echo "  - ${stage} (중간 단계, ECR 푸시 제외)"
              else
                  echo "  - ${stage}"
              fi
          done
          
          echo ""
          echo "📦 ECR에 푸시할 최종 stage들:"
          for stage in "${STAGES[@]}"; do
              echo "  - ${stage}"
          done
          
          # 각 stage별로 이미지 빌드
          echo ""
          echo "🐳 각 stage별 Docker 이미지 빌드 중..."
          
          BUILT_IMAGES=()
          REPOSITORY_NAME="kookmin-feed-crawling-server"
          
          for stage in "${STAGES[@]}"; do
              echo ""
              echo "📦 ${stage} 이미지 빌드 중..."
              
              # 이미지 태그 생성
              IMAGE_TAG="${REPOSITORY_NAME}:${stage}-${{ env.STAGE }}"
              
              # Docker 빌드 실행 (Lambda 호환 아키텍처로 강제 빌드)
              if docker build --platform linux/amd64 --target "${stage}" -t "${IMAGE_TAG}" .; then
                  echo "✅ ${stage} 이미지 빌드 성공: ${IMAGE_TAG}"
                  BUILT_IMAGES+=("${stage}:${IMAGE_TAG}")
              else
                  echo "❌ ${stage} 이미지 빌드 실패"
                  exit 1
              fi
          done
          
          echo ""
          echo "🎉 모든 이미지 빌드 완료!"
          echo ""
          echo "📋 빌드된 이미지들:"
          for image_info in "${BUILT_IMAGES[@]}"; do
              IFS=':' read -r stage tag <<< "$image_info"
              echo "  - ${stage}: ${tag}"
          done
          
          # 빌드된 이미지 정보를 파일로 저장
          BUILD_INFO_FILE=".build-info-${{ env.STAGE }}.txt"
          echo "# Build Info for ${{ env.STAGE }}" > "$BUILD_INFO_FILE"
          echo "BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$BUILD_INFO_FILE"
          echo "STAGE=${{ env.STAGE }}" >> "$BUILD_INFO_FILE"
          echo "REPOSITORY_NAME=${REPOSITORY_NAME}" >> "$BUILD_INFO_FILE"
          echo "" >> "$BUILD_INFO_FILE"
          echo "# Built Images" >> "$BUILD_INFO_FILE"
          for image_info in "${BUILT_IMAGES[@]}"; do
              IFS=':' read -r stage tag <<< "$image_info"
              echo "${stage}=${tag}" >> "$BUILD_INFO_FILE"
          done
          
          echo ""
          echo "💾 빌드 정보가 ${BUILD_INFO_FILE}에 저장되었습니다."
          
          # GitHub Actions output 설정
          echo "build-info-file=${BUILD_INFO_FILE}" >> $GITHUB_OUTPUT
